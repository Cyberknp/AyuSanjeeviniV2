name: ayusanjeevini
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # Pick image from gallery
  image_picker: ^1.1.0

  # TensorFlow Lite inference
  tflite_flutter: ^0.12.1

  # Image decoding / resizing
  image: ^4.1.7

  # For network calls
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/skin_model.tflite
    - assets/models/best_dental_model.tflite
    - assets/models/skin_vs_teeth.tflite
